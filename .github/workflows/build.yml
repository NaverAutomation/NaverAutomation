name: Build/Release

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  push:
    tags:
      - 'v*'

jobs:
  release_drafter:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Release Drafter
        uses: release-drafter/release-drafter@v7.2.0
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Build Electron App (no publish)
        run: npx electron-builder build --win --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and Upload Assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 기존 릴리즈가 있으면 삭제 후 재생성
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true

          # 릴리즈 생성
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes "Release $TAG_NAME" \
            --repo "$GH_REPO"

          # latest.yml이 참조하는 하이픈 형식 파일명으로 rename 후 업로드
          # electron-builder가 로컬에서는 공백/점을 쓰지만 latest.yml에는 하이픈으로 기록함
          EXE_SRC=$(ls "dist_electron/"*.exe | grep -v blockmap | head -n 1)
          BLOCKMAP_SRC=$(ls "dist_electron/"*.exe.blockmap | head -n 1)
          VERSION="${TAG_NAME#v}"
          EXE_DEST="dist_electron/Naver-Auto-Setup-${VERSION}.exe"
          BLOCKMAP_DEST="dist_electron/Naver-Auto-Setup-${VERSION}.exe.blockmap"

          cp "$EXE_SRC" "$EXE_DEST"
          cp "$BLOCKMAP_SRC" "$BLOCKMAP_DEST"

          echo "Uploading: $EXE_DEST"
          gh release upload "$TAG_NAME" "$EXE_DEST" --clobber --repo "$GH_REPO"

          echo "Uploading: $BLOCKMAP_DEST"
          gh release upload "$TAG_NAME" "$BLOCKMAP_DEST" --clobber --repo "$GH_REPO"

          if [ -f "dist_electron/latest.yml" ]; then
            echo "Uploading: dist_electron/latest.yml"
            gh release upload "$TAG_NAME" "dist_electron/latest.yml" --clobber --repo "$GH_REPO"
          fi

  publish_release_notes:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..${TAG_NAME}" --pretty=format:"- %s" 2>/dev/null || echo "")
          else
            NOTES=$(git log "${TAG_NAME}" --pretty=format:"- %s" --max-count=20 2>/dev/null || echo "")
          fi
          if [ -n "$NOTES" ]; then
            gh release edit "$TAG_NAME" --notes "$NOTES" || true
          fi
