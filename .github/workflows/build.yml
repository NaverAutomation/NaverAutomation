name: Build/Release

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  push:
    tags:
      - 'v*'

jobs:
  release_drafter:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Release Drafter
        uses: release-drafter/release-drafter@v7.2.0
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Build and Publish Electron App
        run: npx electron-builder build --win --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_release_notes:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "release_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate and Update Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # gh release edit에 --generate-notes 플래그를 주면 깃허브가 이전 태그 대비 변경 커밋 로그를 자동 생성합니다.
          gh release edit "$TAG_NAME" --generate-notes || gh release create "$TAG_NAME" --generate-notes

      - name: Clean up stale draft releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/${GH_REPO}/releases" \
            --jq '.[] | select(.draft == true) | .id' | \
            while IFS= read -r id; do
              echo "Deleting stale draft release id: $id"
              gh api -X DELETE "repos/${GH_REPO}/releases/${id}" || true
            done
