name: Build/Release

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  push:
    tags:
      - 'v*'

jobs:
  release_drafter:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Release Drafter
        uses: release-drafter/release-drafter@v7.2.0
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create_release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: false

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: create_release
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Build and Publish Electron App
        run: npx electron-builder build --win --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_release_notes:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Update Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # 커밋 로그 기반으로 릴리즈 노트를 자동 생성합니다.
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG_NAME}$" | head -n 1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..${TAG_NAME}" --pretty=format:"- %s" 2>/dev/null || echo "")
          else
            NOTES=$(git log "${TAG_NAME}" --pretty=format:"- %s" --max-count=20 2>/dev/null || echo "")
          fi
          if [ -n "$NOTES" ]; then
            gh release edit "$TAG_NAME" --notes "$NOTES" || true
          fi

      - name: Clean up stale draft releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/${GH_REPO}/releases" \
            --jq '.[] | select(.draft == true) | .id' | \
            while IFS= read -r id; do
              echo "Deleting stale draft release id: $id"
              gh api -X DELETE "repos/${GH_REPO}/releases/${id}" || true
            done
